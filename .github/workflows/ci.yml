name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - name: allow unprivileged ping for ICMP checks
        run: sudo sysctl -w net.ipv4.ping_group_range="0 2147483647"
      - run: go test -race ./...
      - run: go run ./cmd/segwatch validate -p examples/policy.yaml
      - name: static build
        run: CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o segwatch ./cmd/segwatch
